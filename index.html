<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniAgent | Leap 71 Engineering</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --citadel-bg: #050507;
        --citadel-sidebar: #08080a;
        --citadel-inner-bg: #0c0c0e;
        --citadel-border: rgba(255, 255, 255, 0.08);
        --citadel-border-bright: rgba(255, 255, 255, 0.15);
        --citadel-flare: #ffffff;
        --citadel-accent: #3b82f6;
        --citadel-text: #f8fafc;
        --citadel-subtext: #71717a;
        --citadel-card: rgba(12, 12, 14, 0.8);
        --citadel-input: rgba(255, 255, 255, 0.02);
        --citadel-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        --citadel-hover: rgba(255, 255, 255, 0.05);
      }

      [data-theme='light'] {
        --citadel-bg: #f8fafc;
        --citadel-sidebar: #ffffff;
        --citadel-inner-bg: #f1f5f9;
        --citadel-border: rgba(15, 23, 42, 0.1);
        --citadel-border-bright: rgba(15, 23, 42, 0.2);
        --citadel-flare: #0f172a;
        --citadel-accent: #2563eb;
        --citadel-text: #0f172a;
        --citadel-subtext: #64748b;
        --citadel-card: rgba(255, 255, 255, 0.95);
        --citadel-input: rgba(15, 23, 42, 0.05);
        --citadel-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        --citadel-hover: rgba(15, 23, 42, 0.05);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--citadel-bg);
        color: var(--citadel-text);
        overflow: hidden;
        margin: 0;
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.2); 
        border-radius: 10px;
      }

      .glass-card {
        background: var(--citadel-card);
        backdrop-filter: blur(24px);
        border: 1px solid var(--citadel-border);
        box-shadow: var(--citadel-shadow);
      }

      .text-glow-blue {
        text-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 12s linear infinite;
      }

      @keyframes loading-bar {
        0% {
          left: -200%;
          width: 200%;
        }
        100% {
          left: 100%;
          width: 100%;
        }
      }
      .global-loading-bar {
        position: absolute;
        top: 0;
        left: -200%; /* Start off-screen to the left */
        width: 200%; /* Wider than screen for sweep effect */
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--citadel-accent), transparent);
        animation: loading-bar 1.5s infinite linear;
        z-index: 50;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .pulsing-dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        animation: pulse-dot 1.4s infinite ease-in-out both;
      }

      .pulsing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .pulsing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
    </style>
