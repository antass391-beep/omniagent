
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniAgent | Perplexity Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --citadel-bg: #050507;
        --citadel-sidebar: #08080a;
        --citadel-inner-bg: #0c0c0e;
        --citadel-border: rgba(255, 255, 255, 0.08);
        --citadel-border-bright: rgba(255, 255, 255, 0.15);
        --citadel-flare: #ffffff;
        --citadel-accent: #22d3ee;
        --citadel-text: #f8fafc;
        --citadel-subtext: #71717a;
        --citadel-card: rgba(12, 12, 14, 0.8);
        --citadel-input: rgba(255, 255, 255, 0.02);
        --citadel-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        --citadel-hover: rgba(255, 255, 255, 0.05);
      }

      [data-theme='light'] {
        --citadel-bg: #f3f4f6;
        --citadel-sidebar: #ffffff;
        --citadel-inner-bg: #f9fafb;
        --citadel-border: rgba(0, 0, 0, 0.08);
        --citadel-border-bright: rgba(0, 0, 0, 0.15);
        --citadel-flare: #111827;
        --citadel-accent: #0ea5e9;
        --citadel-text: #1f2937;
        --citadel-subtext: #6b7280;
        --citadel-card: rgba(255, 255, 255, 0.95);
        --citadel-input: rgba(0, 0, 0, 0.03);
        --citadel-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        --citadel-hover: rgba(0, 0, 0, 0.03);
      }

      /* CRITICAL FIX FOR IFRAME RENDERING */
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--citadel-bg);
      }

      body {
        font-family: 'Inter', sans-serif;
        color: var(--citadel-text);
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--citadel-border-bright); border-radius: 10px; }

      .glass-card {
        background: var(--citadel-card);
        backdrop-filter: blur(24px);
        border: 1px solid var(--citadel-border);
        box-shadow: var(--citadel-shadow);
      }
    </style>
